<!DOCTYPE html>
<html lang="en">

<head>

            <div class="foto">

        </aside>

        <aside class="aside-competencias">

            <ul>
                <li> <p id="competencia1">Trabalho em Equipe</p> </li>
                <li> <p id="competencia2">Memorização de Peças </p> </li>
                <li> <p id="competencia3">Experiência em Orquestras</p> </li>
                <li> <p id="competencia4">Performance em Turnês </p> </li>
                <li> <p id="competencia5">Experiência Orquestral</p> </li>
                <li> <p id="competencia6">Interpretação Musical</p> </li>
            </ul>
               
        </aside>

        <aside class="aside-idiomas">
            <h1 class="aside-h1">Idiomas</h1>
        </aside>

        <aside class="aside-experiencias">
            <h1 class="aside-h1">Experiências</h1>
        </aside>



        <footer>
            <p>Salvador/Bahia 2026</p>
        </footer>

    </div>

    <script src="assets/script.js"></script>

</html>
